server:
  port: 9999
  context-path: /
  session:
    timeout: 28800
  tomcat:
    uri-encoding: UTF-8


spring:
  application:
    name: knowledge-service
  profiles:
    active: dev
  mvc:
    async:
      request-timeout: 60000
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: "GMT+8"
    serialization: { write-dates-as-timestamps: false }
  cache:
    type: redis
    redis:
      key-prefix: 'AUTO_CACHE\:'
      time-to-live: 1h
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&tinyInt1isBit=false&allowMultiQueries=true
    username: postgres
    password: 762188

mybatis-plus:
  # 支持统配符 * 或者 ; 分割
  mapper-locations: classpath*:/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

local:
  files: /data/files/
  images: /data/images/
  tmp_images: /data/tmp_images/
